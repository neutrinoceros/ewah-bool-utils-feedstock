{% set name = "ewah-bool-utils" %}
{% set version = "1.3.2" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ewah_bool_utils-{{ version }}.tar.gz
  sha256: 9e1d472724debba95cdc8bd1ac7a082a84ce263dcf4e2700b20954fc9c0a5d65

build:
  number: 1
  python_version_independent: true  # [is_abi3]
  skip: true  # [is_abi3 and not is_python_min]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python-abi3                            # [py>=311 and is_abi3]
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - meson-python                           # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - cython
    - numpy
    - meson-python
    - pip
  run:
    - python

test:
  requires:
    - pip
    - abi3audit  # [is_abi3]
  imports:
    - ewah_bool_utils
  commands:
    - pip check
    - abi3audit $SP_DIR/ewah_bool_utils/*.abi3.so -s -v --assume-minimum-abi3 3.11  # [unix and is_abi3]
    # only check a single file on windows because I can't figure out the correct wildcard expression
    # this should be okay as long as there's nothing platform specific in `meson.build`
    - abi3audit %SP_DIR%/ewah_bool_utils/ewah_bool_wrap.pyd -s -v --assume-minimum-abi3 3.11  # [win and is_abi3]

about:
  home: https://pypi.org/project/ewah-bool-utils/
  summary: EWAH Bool Array utils for yt
  license: Apache-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - src/ewah_bool_utils/cpp/LICENSE

extra:
  recipe-maintainers:
    - neutrinoceros
    - matthewturk
